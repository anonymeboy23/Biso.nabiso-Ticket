<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact et assistance · Biso.nabiso-Ticket</title><link rel="stylesheet" href="../styles/style.css"></head>
<body><div id="nav"></div><main id="main"><div class="wrap page" style="max-width:700px">
  <h1>Contact et assistance</h1>
  <div class="panel"><h2>Besoin d’aide ?</h2><p>Pour une question sur un billet, un paiement ou une entrée, préparez le code de commande et le nom de l’événement.</p>
    <div class="inline"><a class="btn" href="mailto:support@bisonabiso-ticket.com">Écrire au support</a><a class="btn btn-ghost" href="aide.html">Consulter le guide</a></div>
  </div>
  <form class="panel" id="contact-form"><h2>Envoyer une demande</h2>
    <label class="field"><span>Nom</span><input name="name" required></label>
    <label class="field"><span>E-mail</span><input name="email" type="email" required></label>
    <label class="field"><span>Sujet</span><select name="subject"><option>Problème avec un billet</option><option>Paiement</option><option>Accès à un événement</option><option>Autre</option></select></label>
    <label class="field"><span>Message</span><textarea name="message" required minlength="10"></textarea></label>
    <button class="btn" type="submit">Préparer l’e-mail</button>
    <p id="contact-note" class="muted small"></p>
  </form>
</div></main><script src="../scripts/config.js"></script><script src="../scripts/app.js"></script><script>
  App.renderNav("", null);
  document.querySelector("#contact-form").onsubmit = (e) => { e.preventDefault(); const f = new FormData(e.target); const body = `Nom : ${f.get("name")}\nE-mail : ${f.get("email")}\n\n${f.get("message")}`; location.href = `mailto:support@bisonabiso-ticket.com?subject=${encodeURIComponent(f.get("subject"))}&body=${encodeURIComponent(body)}`; document.querySelector("#contact-note").textContent = "Votre application e-mail va s’ouvrir pour envoyer la demande."; };
</script></body></html>
