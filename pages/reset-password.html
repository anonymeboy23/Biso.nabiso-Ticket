<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réinitialiser le mot de passe · Biso.nabiso-Ticket</title>
<link rel="stylesheet" href="../styles/style.css">
</head>
<body>
<div id="nav"></div>
<main id="main">
  <div class="wrap page" style="max-width:560px">
    <h1>Réinitialiser votre mot de passe</h1>
    <div class="panel">
      <h3>Comment faire ?</h3>
      <ol>
        <li>Choisissez un nouveau mot de passe d'au moins 8 caractères.</li>
        <li>Confirmez-le dans le deuxième champ.</li>
        <li>Cliquez sur « Enregistrer ». Vous pourrez ensuite vous reconnecter.</li>
      </ol>
    </div>
    <div id="message"></div>
    <form id="reset-form" class="panel">
      <label class="field"><span>Nouveau mot de passe</span><input id="password" type="password" minlength="8" required autocomplete="new-password"></label>
      <label class="field"><span>Confirmer le mot de passe</span><input id="confirmation" type="password" minlength="8" required autocomplete="new-password"></label>
      <button class="btn btn-block" type="submit">Enregistrer le nouveau mot de passe</button>
    </form>
    <p class="small muted"><a href="connexion.html">Retour à la connexion</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../scripts/config.js"></script>
<script src="../scripts/app.js"></script>
<script>
(async () => {
  const sb = App.sb;
  const form = App.$("#reset-form");
  const message = App.$("#message");
  if (!sb) return App.showBlock("<h2>Connexion impossible</h2><p>La base de données n'est pas configurée.</p>");

  const { data, error } = await sb.auth.getSession();
  if (error || !data.session) {
    form.classList.add("hidden");
    message.innerHTML = "<div class='alert bad'><b>Lien expiré ou invalide.</b><br>Demandez un nouveau lien depuis « Mot de passe oublié ? ».</div>";
    return;
  }

  form.onsubmit = async (event) => {
    event.preventDefault();
    const button = form.querySelector("button");
    await App.run(button, async () => {
      const password = App.$("#password").value;
      const confirmation = App.$("#confirmation").value;
      if (password.length < 8) throw new Error("Le mot de passe doit contenir au moins 8 caractères.");
      if (password !== confirmation) throw new Error("Les mots de passe ne correspondent pas.");
      const result = await sb.auth.updateUser({ password });
      if (result.error) throw result.error;
      await sb.auth.signOut();
      form.classList.add("hidden");
      message.innerHTML = "<div class='alert ok'><b>Mot de passe modifié avec succès.</b><br>Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</div>";
    });
  };
})();
</script>
</body>
</html>
